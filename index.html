<!DOCTYPE html>
<html>
<head></head>
<style>
html, body {
    margin: 0;
    height: 100%;
}
#bigname {
    position: fixed;
    color: gray;
    text-align: center;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
#name {
    position: fixed;
    top: 0;
    left: 0;
    color: red;
    width: 170px;
    font-size: 32px;
}
</style>
<script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
<script>
let v = 1;
$(document).ready(function() {
    let x = 0; let y = 0;
    let vx = v; let vy = -v;
    setInterval(function() {
        let rect = $("html")[0].getBoundingClientRect();
        x = x + vx;
        y = y + vy;
        $("#name").css('left', x);
        $("#name").css('top', y);
        if(x < rect.x - 5) vx = v;
        else if(x > rect.x + rect.width - 160) vx = -v;
        if(y < rect.y - 10) vy = v;
        else if(y > rect.y + rect.height - 30) vy = -v;
    }, 10);
});
</script>
<body>
<div id="bigname">
<div style="font-size:100px"><b>Erica Wang</b></div>
<br>
<a href="legacy/index.html" style="font-size:20px">Legacy Website (2022)</a>
</div>
<div id="name"><b>Erica Wang</b></div>
</body>
</html>
